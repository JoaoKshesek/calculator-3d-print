<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jolina 3D. Calculadora de custo de impressão 3D: filamento, energia, amortização da impressora, mão de obra e margem de lucro." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/mark.png" />
    <script>
      // Padrão é claro; aplica dark salvo antes do React renderizar, evitando "flash" de cor
      try {
        var t = localStorage.getItem('calc3d:theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <title>Jolina 3D · Calculadora de custos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
